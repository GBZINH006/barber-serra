<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo — BARBER SERRA</title>
    <meta name="theme-color" content="#090a0d">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/cliente-login.css">
</head>
<body class="auth-body">

    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <a href="../index.html" class="auth-brand" aria-label="Voltar para a página inicial">
                    <div class="logo-icon">
                        <i class="fas fa-cut"></i>
                    </div>
                    <div class="logo-text" style="text-align: left;">
                        <span class="logo-name" style="font-weight: 800; font-size: 1.1rem; color: var(--text-primary);">BARBER SERRA</span>
                        <span class="logo-sub" style="font-size: 0.625rem; color: var(--accent); letter-spacing: 0.1em; display: block;">PAINEL DO BARBEIRO</span>
                    </div>
                </a>
                <h1 class="auth-title">Acesso Restrito</h1>
                <p class="auth-subtitle">Gestão de agendamentos, equipe, clientes e faturamento</p>
            </div>

            <!-- Login Form -->
            <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="admin-email"><i class="fas fa-envelope"></i> E-mail de Barbeiro / Admin</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope input-icon-left"></i>
                        <input type="email" id="admin-email" class="form-control" placeholder="barbeiro@barberserra.com" required value="mateus@barberserra.com">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="admin-password"><i class="fas fa-lock"></i> Senha</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock input-icon-left"></i>
                        <input type="password" id="admin-password" class="form-control" placeholder="••••••••" required value="123456">
                        <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('admin-password')" aria-label="Ver senha">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="admin-remember-me" checked>
                        <span>Manter conectado</span>
                    </label>
                    <a href="#" class="forgot-link" onclick="openAdminResetModal(event)">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;" id="btn-submit-admin-login">
                    <i class="fas fa-sign-in-alt"></i> Acessar Painel Executivo
                </button>
            </form>

            <!-- Acesso Rápido Demo -->
            <div class="demo-login-box">
                <button type="button" class="btn-demo" onclick="acessarAdminComoDemo()">
                    <i class="fas fa-bolt text-accent"></i> Acessar como <strong>Mateus Rabelo (Master Barber)</strong>
                </button>
            </div>

            <!-- Footer -->
            <div class="auth-footer">
                <a href="../index.html" class="back-to-site">
                    <i class="fas fa-arrow-left"></i> Voltar ao site principal
                </a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/ui-core.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
