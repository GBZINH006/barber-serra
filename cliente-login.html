<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Cliente — BARBER SERRA</title>
    <meta name="description" content="Acesse sua conta para gerenciar agendamentos, ver pontos fidelidade e remarcar horários na Barber Serra.">
    <meta name="theme-color" content="#090a0d">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/cliente-login.css">
</head>
<body class="auth-body">

    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <a href="index.html" class="auth-brand" aria-label="Voltar para a página inicial">
                    <div class="logo-icon">
                        <i class="fas fa-cut"></i>
                    </div>
                    <div class="logo-text" style="text-align: left;">
                        <span class="logo-name" style="font-weight: 800; font-size: 1.1rem; color: var(--text-primary);">BARBER SERRA</span>
                        <span class="logo-sub" style="font-size: 0.625rem; color: var(--accent); letter-spacing: 0.1em; display: block;">PORTAL DO CLIENTE</span>
                    </div>
                </a>
                <h1 class="auth-title">Bem-vindo de volta</h1>
                <p class="auth-subtitle">Acesse seus agendamentos e histórico VIP</p>
            </div>

            <!-- Tabs: Entrar / Cadastro -->
            <div class="auth-tabs">
                <button type="button" class="tab-btn active" data-tab="login">Entrar</button>
                <button type="button" class="tab-btn" data-tab="cadastro">Criar Conta</button>
            </div>

            <!-- Form: Login -->
            <form id="login-form" class="auth-form active">
                <div class="form-group">
                    <label class="form-label" for="login-email"><i class="fas fa-envelope"></i> E-mail</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope input-icon-left"></i>
                        <input type="email" id="login-email" class="form-control" placeholder="seu@email.com" required value="gabriel@exemplo.com">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="login-password"><i class="fas fa-lock"></i> Senha</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock input-icon-left"></i>
                        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required value="123456">
                        <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('login-password')" aria-label="Ver senha">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember-me" checked>
                        <span>Lembrar meu acesso</span>
                    </label>
                    <a href="#" class="forgot-link" onclick="openResetPasswordModal(event)">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;" id="btn-submit-login">
                    <i class="fas fa-sign-in-alt"></i> Entrar na Conta
                </button>
            </form>

            <!-- Form: Cadastro -->
            <form id="cadastro-form" class="auth-form">
                <div class="form-group">
                    <label class="form-label" for="cadastro-nome"><i class="fas fa-user"></i> Nome Completo</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user input-icon-left"></i>
                        <input type="text" id="cadastro-nome" class="form-control" placeholder="Seu nome completo" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="cadastro-telefone"><i class="fab fa-whatsapp"></i> WhatsApp / Celular</label>
                    <div class="input-with-icon">
                        <i class="fab fa-whatsapp input-icon-left"></i>
                        <input type="tel" id="cadastro-telefone" class="form-control" placeholder="(48) 99999-9999" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="cadastro-email"><i class="fas fa-envelope"></i> E-mail</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope input-icon-left"></i>
                        <input type="email" id="cadastro-email" class="form-control" placeholder="seu@email.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="cadastro-password"><i class="fas fa-lock"></i> Senha (mín. 6 caracteres)</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock input-icon-left"></i>
                        <input type="password" id="cadastro-password" class="form-control" placeholder="••••••••" required minlength="6">
                        <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('cadastro-password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;" id="btn-submit-cadastro">
                    <i class="fas fa-user-plus"></i> Concluir Cadastro
                </button>
            </form>

            <!-- Acesso Rápido Demo -->
            <div class="demo-login-box">
                <button type="button" class="btn-demo" onclick="acessarComoDemo()">
                    <i class="fas fa-bolt text-accent"></i> Acessar com <strong>Conta Demonstração</strong> (1 clique)
                </button>
            </div>

            <!-- Footer -->
            <div class="auth-footer">
                <a href="index.html" class="back-to-site">
                    <i class="fas fa-arrow-left"></i> Voltar à página inicial
                </a>
            </div>
        </div>
    </div>

    <!-- Modal: Recuperar Senha -->
    <div class="modal-backdrop" id="modal-reset-password">
        <div class="modal-panel">
            <div class="modal-header">
                <h3 class="modal-title"><i class="fas fa-key text-accent"></i> Recuperar Senha</h3>
                <button type="button" class="modal-close-btn" onclick="UICore.closeModal('modal-reset-password')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="reset-password-form" onsubmit="handleResetPasswordSubmit(event)">
                <div class="modal-body">
                    <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 1.25rem;">
                        Digite o e-mail cadastrado na sua conta para enviarmos um link de redefinição segura.
                    </p>
                    <div class="form-group">
                        <label class="form-label" for="reset-email"><i class="fas fa-envelope"></i> E-mail Cadastrado</label>
                        <input type="email" id="reset-email" class="form-control" placeholder="seu@email.com" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="UICore.closeModal('modal-reset-password')">Cancelar</button>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Enviar Instruções</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/ui-core.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/cliente-auth.js"></script>
</body>
</html>
